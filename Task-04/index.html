<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crypto Tracker</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <header>
        <h1>Crypto Tracker</h1>

        <button id="themeToggle">🌙 Dark Mode</button>
    </header>

    <main>

        <!-- Search -->
        <section class="search-section">
            <input
                type="text"
                id="searchInput"
                placeholder="Search cryptocurrency..."
            >
            <button id="searchButton">Search</button>
        </section>

        <!-- Coin Information -->
        <section class="coin-card">

            <div>
                <h2 id="coinName">Bitcoin</h2>
                <p id="coinSymbol">BTC</p>
            </div>

            <div class="coin-price">
                <h2 id="coinPrice">$0.00</h2>
                <p id="coinChange">0.00%</p>

                <button id="wishlistButton">⭐ Add to Wishlist</button>
            </div>

        </section>

        <!-- Chart -->
        <section class="chart-section">

            <div class="section-heading">
                <h2>Price Chart</h2>

                <div class="time-buttons">
            
                      <button data-days="1">24H</button>
                      <button data-days="7">1W</button>
                      <button data-days="30">1M</button>
                      <button data-days="90">3M</button>
                      <button data-days="365">1Y</button>
                </div>
            </div>

            <div class="chart-container">
                <canvas id="priceChart"></canvas>
            </div>

        </section>

        <!-- Wishlist -->
        <section class="wishlist-section">

            <div class="section-heading">
                <h2>⭐ My Wishlist</h2>
            </div>

            <div id="wishlist">
                <p>No cryptocurrencies added yet.</p>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
